<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transactions - ARTHA</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/landing.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="app-header" class="app-header"></header>
  <p id="load-error" class="form-error" role="alert" hidden></p>

  <main id="protected-content" class="app-main stack" hidden>
    <div class="page-head">
      <div>
        <h1>Transactions</h1>
        <p class="page-head__sub">Record income and expenses, then search and filter your history.</p>
      </div>
      <button id="add-btn" class="btn btn--primary" type="button">+ Add transaction</button>
    </div>

    <section class="stats" aria-label="Totals for the current filters">
      <div class="card stat"><p class="stat__label">Income</p><p class="stat__value is-income" id="total-income">-</p></div>
      <div class="card stat"><p class="stat__label">Expenses</p><p class="stat__value is-expense" id="total-expense">-</p></div>
      <div class="card stat"><p class="stat__label">Net</p><p class="stat__value" id="total-net">-</p></div>
    </section>

    <section class="card" aria-label="Filters">
      <form id="filter-form" class="form-grid" novalidate>
        <div class="field"><label for="f-q">Search</label><input id="f-q" type="search" maxlength="100" placeholder="Description or category"></div>
        <div class="field"><label for="f-type">Type</label>
          <select id="f-type"><option value="">All</option><option value="income">Income</option><option value="expense">Expense</option></select></div>
        <div class="field"><label for="f-category">Category</label><select id="f-category"><option value="">All</option></select></div>
        <div class="field"><label for="f-from">From</label><input id="f-from" type="date"></div>
        <div class="field"><label for="f-to">To</label><input id="f-to" type="date"></div>
        <div class="field"><label for="f-min">Min amount</label><input id="f-min" type="number" min="0" step="0.01" inputmode="decimal"></div>
        <div class="field"><label for="f-max">Max amount</label><input id="f-max" type="number" min="0" step="0.01" inputmode="decimal"></div>
        <div class="field"><label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="date:desc">Newest first</option><option value="date:asc">Oldest first</option>
            <option value="amount:desc">Amount: high to low</option><option value="amount:asc">Amount: low to high</option>
          </select></div>
        <div class="btn-row">
          <button class="btn btn--primary" type="submit">Apply</button>
          <button id="reset-btn" class="btn" type="button">Reset</button>
        </div>
      </form>
      <p id="filter-error" class="field-error" role="alert"></p>
    </section>

    <section class="card" aria-label="Transaction history">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th class="num">Amount</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
      <div id="tx-empty" class="empty" hidden></div>
      <div class="pager">
        <span id="pager-info"></span>
        <div class="btn-row">
          <button id="prev-btn" class="btn btn--sm" type="button">Previous</button>
          <button id="next-btn" class="btn btn--sm" type="button">Next</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="tx-dialog" aria-labelledby="tx-dialog-title">
    <h2 id="tx-dialog-title">Add transaction</h2>
    <form id="tx-form" novalidate>
      <div id="tx-error" class="form-error" role="alert" hidden></div>
      <div class="field">
        <label id="tx-type-label">Type</label>
        <div class="segmented" role="radiogroup" aria-labelledby="tx-type-label">
          <label><input type="radio" name="type" value="expense" checked><span>Expense</span></label>
          <label><input type="radio" name="type" value="income"><span>Income</span></label>
        </div>
        <p class="field-error" id="tx-type-error"></p>
      </div>
      <div class="field"><label for="tx-category">Category</label><select id="tx-category"></select><p class="field-error" id="tx-category-error"></p></div>
      <div class="field"><label for="tx-amount">Amount (₹)</label><input id="tx-amount" type="number" min="0.01" step="0.01" inputmode="decimal" required><p class="field-error" id="tx-amount-error"></p></div>
      <div class="field"><label for="tx-date">Date</label><input id="tx-date" type="date" required><p class="field-error" id="tx-date-error"></p></div>
      <div class="field"><label for="tx-description">Description (optional)</label><input id="tx-description" type="text" maxlength="200"><p class="field-error" id="tx-description-error"></p></div>
      <div class="btn-row">
        <button id="tx-cancel" class="btn" type="button">Cancel</button>
        <button id="tx-save" class="btn btn--primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <script src="/js/utils.js"></script>
  <script src="/js/dom.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/transactions.js"></script>
</body>
</html>
